
name: HalloweenEvents
version: 1.0.0
main: net.surrealsmp.halloweenevents.HalloweenEvents
api-version: '1.21'
description: Configurable Halloween events for SurRealSMP
author: SurRealSMP

commands:
  halloween:
    description: Manage Halloween events
    usage: /halloween <start|stop|reload|status|help> [world]
    permission: halloweenevents.admin

permissions:
  halloweenevents.admin:
    description: Allows managing Halloween events
    default: op
